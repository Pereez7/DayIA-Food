<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAYIA FOOD — SPK-PRINT-001</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">DAYIA FOOD · SPIKE TÉCNICO DESCARTABLE</p>
      <h1 id="spike-id">SPK-PRINT-001</h1>
      <p class="scope">
        Bootstrap de runtime. Sin impresión, red, cola ni integración productiva.
      </p>

      <dl aria-label="Información técnica del runtime">
        <div>
          <dt>Aplicación</dt>
          <dd id="app-version">pending</dd>
        </div>
        <div>
          <dt>Tauri</dt>
          <dd id="tauri-version">pending</dd>
        </div>
        <div>
          <dt>Sistema operativo</dt>
          <dd id="operating-system">pending</dd>
        </div>
        <div>
          <dt>Arquitectura</dt>
          <dd id="architecture">pending</dd>
        </div>
        <div>
          <dt>WebView2</dt>
          <dd id="webview2-status">pending</dd>
        </div>
        <div>
          <dt>Estado</dt>
          <dd id="runtime-status" role="status" aria-live="polite">
            runtime-starting
          </dd>
        </div>
      </dl>

      <button id="close-app" type="button" disabled>Cerrar aplicación</button>
    </main>
  </body>
</html>
